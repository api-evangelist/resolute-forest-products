aid: resolute-forest-products
name: Resolute Forest Products
description: >-
  Resolute Forest Products is a global leader in the forest products industry,
  producing market pulp, tissue, wood products, and newsprint. Formerly one of
  the largest pulp and paper companies in North America, the company operates
  manufacturing facilities across Canada and the United States. In 2023,
  Resolute was acquired by the Paper Excellence Group and now operates as a
  subsidiary of Domtar. The company supplies products to customers in more than
  70 countries.
